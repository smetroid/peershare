apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "relay.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "relay.labels" . | nindent 4 }}
  ports:
    - {name: tcp, port: {{ .Values.service.port }}, targetPort: tcp, protocol: TCP}
    - {name: quic, port: {{ .Values.service.port }}, targetPort: quic, protocol: UDP}
